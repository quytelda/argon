name:                mangrove-cli
version:             0.3.0.0
github:              "quytelda/mangrove"
license:             BSD-3-Clause
author:              "Quytelda Kahja"
maintainer:          "quytelda@tamalin.org"
copyright:           "Copyright 2026 Quytelda Kahja"

extra-source-files:
- README.md
- CHANGELOG.md

# Metadata used when publishing your package
synopsis:            Build CLI argument parsers using Applicative.
category:            CLI, Options, Parsing

# To avoid duplicated efforts in documentation and dealing with the
# complications of embedding Haddock markup inside cabal files, it is
# common to point users to the README.md file.
description:         Please see the README on GitHub at <https://github.com/quytelda/mangrove#readme>

dependencies:
- base >= 4.7 && < 5
- containers >= 0.6.4 && < 0.9
- mtl >= 2.2.2 && < 2.4
- text >= 1.2.5 && < 2.2
- transformers >= 0.5.6 && < 0.7

ghc-options:
- -Wall
- -Wcompat
- -Widentities
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wmissing-export-lists
- -Wmissing-home-modules
- -Wpartial-fields
- -Wredundant-constraints

library:
  source-dirs: src

tests:
  mangrove-cli-test:
    main:                Main.hs
    source-dirs:         test
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - mangrove-cli
    - hspec >= 2.8.5 && < 3
    - QuickCheck >= 2.14.2 && < 2.16
    - quickcheck-instances >= 0.3.28 && < 0.4
    - random >= 1.2.1.1 && < 1.3
    build-tools:
    - hspec-discover >= 2.8.5 && < 3
